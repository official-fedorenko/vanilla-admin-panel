<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обращения пользователей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    @media (max-width: 768px) {
      input:not([type="checkbox"]):not([type="radio"]) { font-size: 16px !important; }
    }

    :root {
      --bg-color: #050505;
      --bg-surface: rgba(14, 14, 20, 0.8);
      --bg-card: rgba(20, 20, 28, 0.7);
      --bg-input: rgba(255,255,255,0.04);
      --text-primary: #ffffff;
      --text-secondary: #a0a0ab;
      --text-muted: #606068;
      --accent-purple: #8a2be2;
      --accent-cyan: #00d2ff;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(138, 43, 226, 0.6);
      --red: #ff4a6e;
      --green: #00e5a0;
      --glass-blur: blur(20px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex; flex-direction: column;
    }
    a { color: inherit; }

    nav {
      background: var(--bg-surface); backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .btn-home {
      display: flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 600;
      color: var(--text-secondary); border: 1px solid var(--border-color);
      background: none; cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .btn-home:hover { color: var(--text-primary); border-color: var(--border-focus); }

    .messenger {
      flex: 1; min-height: 0;
      max-width: 1400px; width: 100%; margin: 0 auto;
      display: grid; grid-template-columns: 340px 1fr;
    }
    .msg-sidebar {
      border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; min-height: 0;
    }
    .msg-sidebar-head { padding: 16px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .msg-sidebar-head h1 { font-size: 18px; margin-bottom: 10px; }
    .msg-search {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-color);
      background: var(--bg-input); color: var(--text-primary); font-size: 14px; outline: none;
    }
    .msg-search:focus { border-color: var(--border-focus); }
    .msg-contacts { flex: 1; overflow-y: auto; }
    .msg-contact {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer;
      border-bottom: 1px solid var(--border-color); transition: background 0.15s;
    }
    .msg-contact:hover { background: rgba(255,255,255,0.03); }
    .msg-contact.active { background: rgba(138,43,226,0.12); }
    .msg-avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
    }
    .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg-contact-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .msg-contact-name-row { display: flex; align-items: center; gap: 6px; }
    .msg-contact-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-contact-preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-contact-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .msg-contact-time { font-size: 11px; color: var(--text-muted); }
    .msg-badge {
      background: var(--red); color: #fff; border-radius: 10px; min-width: 18px; text-align: center;
      padding: 1px 6px; font-size: 11px; font-weight: 700;
    }
    .msg-status-badge {
      font-size: 10px; color: var(--text-muted); border: 1px solid var(--border-color);
      border-radius: 6px; padding: 1px 6px; flex-shrink: 0;
    }
    .msg-empty-state {
      display: flex; align-items: center; justify-content: center; height: 100%;
      color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px;
    }

    .msg-chat { display: flex; flex-direction: column; min-height: 0; }
    .msg-chat-head {
      display: flex; align-items: center; gap: 12px; padding: 14px 20px;
      border-bottom: 1px solid var(--border-color); flex-shrink: 0;
    }
    .msg-back-btn {
      display: none; background: none; border: none; color: var(--text-secondary);
      cursor: pointer; padding: 4px; flex-shrink: 0;
    }
    .msg-chat-name { font-weight: 600; font-size: 15px; }
    .msg-chat-email { font-size: 12px; color: var(--text-muted); }
    .msg-status-toggle {
      margin-left: auto; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-input); color: var(--text-secondary); font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .msg-status-toggle:hover { border-color: var(--border-focus); color: var(--text-primary); }
    .msg-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg-bubble-row { display: flex; flex-direction: column; }
    .msg-bubble-time { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .msg-bubble {
      padding: 10px 14px; border-radius: 14px; max-width: 65%; word-break: break-word;
      border: 1px solid var(--border-color); font-size: 14px; line-height: 1.4;
    }
    .msg-bubble img { max-width: 200px; max-height: 200px; border-radius: 8px; margin-top: 6px; display: block; }
    .msg-form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border-color); flex-shrink: 0; }
    .msg-form input {
      flex: 1; min-width: 0; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border-color);
      background: var(--bg-input); color: var(--text-primary); font-size: 14px; outline: none;
    }
    .msg-form input:focus { border-color: var(--border-focus); }
    .msg-form button {
      padding: 11px 22px; border-radius: 12px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap;
    }
    .msg-closed-banner {
      font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.03);
      border-top: 1px solid var(--border-color); padding: 8px 20px; text-align: center;
    }

    @media (max-width: 768px) {
      .messenger { grid-template-columns: 1fr; }
      .msg-sidebar, .msg-chat { display: none; }
      body:not(.chat-open) .msg-sidebar { display: flex; }
      body.chat-open .msg-chat { display: flex; }
      .msg-back-btn { display: flex; align-items: center; }
      .nav-title span.only-desktop { display: none; }
    }

    .toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 2000; }
    .toast {
      background: rgba(20,20,28,0.95); border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-purple);
      color: var(--text-primary); padding: 14px 18px; border-radius: 10px;
      font-size: 14px; transform: translateX(120%);
      transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275); min-width: 260px;
    }
    .toast.success { border-left-color: var(--green); }
    .toast.error { border-left-color: var(--red); }
    .toast.show { transform: translateX(0); }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-title">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20" style="color: var(--accent-purple);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
        <span>Обращения пользователей</span>
      </div>
      <div class="nav-right">
        <a href="/admin/#support" class="btn-home">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span class="only-desktop">Админ-панель</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="messenger">
    <div class="msg-sidebar">
      <div class="msg-sidebar-head">
        <h1>Пользователи</h1>
        <input type="text" id="msgSearch" class="msg-search" placeholder="Поиск по имени или email..." autocomplete="off">
      </div>
      <div class="msg-contacts" id="msgContacts">
        <div class="msg-empty-state">Загрузка...</div>
      </div>
    </div>

    <div class="msg-chat" id="msgChatPane">
      <div class="msg-chat-head">
        <button type="button" class="msg-back-btn" id="msgBackBtn" aria-label="Назад">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22" height="22"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div class="msg-avatar" id="msgChatAvatar" style="width:34px;height:34px;font-size:13px;">?</div>
        <div>
          <div class="msg-chat-name" id="msgChatName">Выберите обращение</div>
          <div class="msg-chat-email" id="msgChatEmail"></div>
        </div>
        <button type="button" class="msg-status-toggle" id="msgStatusToggle" style="display:none;"></button>
      </div>
      <div class="msg-messages" id="msgMessages">
        <div class="msg-empty-state">Выберите пользователя слева, чтобы открыть переписку</div>
      </div>
      <div class="msg-closed-banner" id="msgClosedBanner" style="display:none;">Обращение закрыто. Новое сообщение снова откроет его.</div>
      <form class="msg-form" id="msgForm" style="display:none;">
        <input type="text" id="msgInput" placeholder="Написать ответ..." required autocomplete="off">
        <button type="submit">Отправить</button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    let contactsCache = [];
    let activeTicketId = null;
    let activeTicketStatus = 'open';
    let messagesCache = [];
    let eventSource = null;
    let pollingInterval = null;
    let listStream = null;

    function showToast(msg, type = 'success') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3500);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function shortWhen(raw) {
      if (!raw) return '';
      const d = new Date(String(raw).replace(' ', 'T'));
      if (isNaN(d)) return '';
      const diff = Date.now() - d.getTime();
      const min = Math.floor(diff / 60000);
      if (min < 1) return 'только что';
      if (min < 60) return `${min} мин`;
      const h = Math.floor(min / 60);
      if (h < 24) return `${h} ч`;
      return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    }

    async function init() {
      await loadContacts();
      startListStream();
      const withId = new URLSearchParams(location.search).get('with');
      if (withId) openConversation(withId, { pushState: false });
    }

    async function loadContacts(query = '') {
      try {
        const res = await fetch('/api/support/users');
        if (!res.ok) { window.location.href = '/admin/'; return; }
        const data = await res.json();
        let list = data.users || [];
        const q = query.trim().toLowerCase();
        if (q) list = list.filter(u => (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q));
        list.sort((a, b) => {
          if ((b.unread_count || 0) !== (a.unread_count || 0)) return (b.unread_count || 0) - (a.unread_count || 0);
          const ta = a.last_activity ? Date.parse(String(a.last_activity).replace(' ', 'T')) : 0;
          const tb = b.last_activity ? Date.parse(String(b.last_activity).replace(' ', 'T')) : 0;
          if (tb !== ta) return tb - ta;
          return (a.name || '').localeCompare(b.name || '', 'ru');
        });
        contactsCache = list;
        renderContacts();
      } catch (e) {}
    }

    function renderContacts() {
      const list = document.getElementById('msgContacts');
      if (!contactsCache.length) {
        list.innerHTML = '<div class="msg-empty-state">Пока нет пользователей</div>';
        return;
      }
      list.innerHTML = contactsCache.map(c => {
        const letter = (c.name || '?').charAt(0).toUpperCase();
        const avatar = c.avatar_url ? `<img src="${c.avatar_url}" alt="">` : letter;
        const fromAdmin = c.last_sender_role === 'Admin' || c.last_sender_role === 'Superadmin';
        const preview = c.last_message
          ? (fromAdmin ? 'Вы: ' : '') + escapeHtml(String(c.last_message).replace(/\s+/g, ' ').trim())
          : (c.email ? escapeHtml(c.email) + ' · нет переписки' : 'Нет переписки — напишите первым');
        const activeClass = c.ticket_id === activeTicketId ? ' active' : '';
        const closedBadge = c.status === 'closed' ? '<span class="msg-status-badge">закрыт</span>' : '';
        return `
          <div class="msg-contact${activeClass}" onclick="openConversation('${c.ticket_id}')">
            <div class="msg-avatar">${avatar}</div>
            <div class="msg-contact-info">
              <div class="msg-contact-name-row">
                <span class="msg-contact-name">${escapeHtml(c.name || 'Пользователь')}</span>
                ${closedBadge}
              </div>
              <div class="msg-contact-preview">${preview}</div>
            </div>
            <div class="msg-contact-meta">
              ${c.last_activity ? `<span class="msg-contact-time">${shortWhen(c.last_activity)}</span>` : ''}
              ${c.unread_count > 0 ? `<span class="msg-badge">${c.unread_count}</span>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    document.getElementById('msgSearch').addEventListener('input', (e) => loadContacts(e.target.value));

    function startListStream() {
      if (listStream) { listStream.close(); listStream = null; }
      try {
        listStream = new EventSource('/api/support/stream/admin');
        listStream.onmessage = (e) => {
          let data;
          try { data = JSON.parse(e.data); } catch (err) { return; }
          if (data && data.type === 'ticket_updated') {
            loadContacts(document.getElementById('msgSearch').value);
            if (activeTicketId && data.ticketId === activeTicketId) loadMessages(true);
          }
        };
        listStream.onerror = () => { if (listStream) { listStream.close(); listStream = null; } };
      } catch (e) { listStream = null; }
    }

    function renderStatusToggle() {
      const btn = document.getElementById('msgStatusToggle');
      if (!activeTicketId) { btn.style.display = 'none'; return; }
      btn.style.display = '';
      btn.textContent = activeTicketStatus === 'closed' ? 'Открыть заново' : 'Закрыть обращение';
      document.getElementById('msgClosedBanner').style.display = activeTicketStatus === 'closed' ? 'block' : 'none';
    }

    document.getElementById('msgStatusToggle').addEventListener('click', async () => {
      if (!activeTicketId) return;
      const endpoint = activeTicketStatus === 'closed' ? '/api/support/reopen' : '/api/support/close';
      try {
        const res = await fetch(endpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ticketId: activeTicketId })
        });
        if (res.ok) {
          activeTicketStatus = activeTicketStatus === 'closed' ? 'open' : 'closed';
          renderStatusToggle();
          showToast(activeTicketStatus === 'closed' ? 'Обращение закрыто' : 'Обращение открыто заново', 'success');
          loadContacts();
        } else {
          showToast('Не удалось изменить статус', 'error');
        }
      } catch (e) { showToast('Ошибка сети', 'error'); }
    });

    window.openConversation = async function (ticketId, opts = {}) {
      const { pushState = true } = opts;
      activeTicketId = ticketId;
      document.body.classList.add('chat-open');

      const contact = contactsCache.find(c => c.ticket_id === ticketId);
      const name = contact ? contact.name : 'Пользователь';
      document.getElementById('msgChatName').textContent = name;
      document.getElementById('msgChatEmail').textContent = contact && contact.email ? contact.email : '';
      const avatarEl = document.getElementById('msgChatAvatar');
      avatarEl.innerHTML = contact && contact.avatar_url ? `<img src="${contact.avatar_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : (name || '?').charAt(0).toUpperCase();
      document.getElementById('msgForm').style.display = 'flex';

      renderContacts();
      if (pushState) history.pushState({ with: ticketId }, '', `/admin/support-inbox.html?with=${encodeURIComponent(ticketId)}`);

      await loadMessages();
      await fetch('/api/support/read', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticketId })
      });
      loadContacts();
      connectStream(ticketId);
      if (window.innerWidth > 768) document.getElementById('msgInput').focus();
    };

    window.closeConversation = function () {
      closeStream();
      activeTicketId = null;
      document.body.classList.remove('chat-open');
      document.getElementById('msgChatName').textContent = 'Выберите обращение';
      document.getElementById('msgChatEmail').textContent = '';
      document.getElementById('msgChatAvatar').textContent = '?';
      document.getElementById('msgMessages').innerHTML = '<div class="msg-empty-state">Выберите пользователя слева, чтобы открыть переписку</div>';
      document.getElementById('msgForm').style.display = 'none';
      document.getElementById('msgClosedBanner').style.display = 'none';
      renderStatusToggle();
      history.pushState({}, '', '/admin/support-inbox.html');
      renderContacts();
    };
    document.getElementById('msgBackBtn').addEventListener('click', closeConversation);

    window.addEventListener('popstate', (e) => {
      const withId = e.state && e.state.with;
      if (withId) openConversation(withId, { pushState: false });
      else closeConversation();
    });

    async function loadMessages(isPolling = false) {
      if (!activeTicketId) return;
      try {
        const res = await fetch(`/api/support/messages?ticketId=${encodeURIComponent(activeTicketId)}`);
        if (!res.ok) return;
        const data = await res.json();
        messagesCache = data.messages || [];
        activeTicketStatus = data.status || 'open';
        renderStatusToggle();
        renderMessages(isPolling);
      } catch (e) {}
    }

    function renderMessages(isPolling) {
      const container = document.getElementById('msgMessages');
      const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 10;
      if (!messagesCache.length) {
        container.innerHTML = '<div class="msg-empty-state">Здесь пока нет сообщений.</div>';
        return;
      }
      container.innerHTML = messagesCache.map(msg => {
        const isAdmin = msg.sender_role === 'Admin' || msg.sender_role === 'Superadmin';
        const align = isAdmin ? 'flex-end' : 'flex-start';
        const bg = isAdmin ? 'linear-gradient(135deg, var(--accent-purple), var(--accent-cyan))' : 'var(--bg-input)';
        const color = isAdmin ? '#fff' : 'inherit';
        const border = isAdmin ? 'transparent' : 'var(--border-color)';
        const name = msg.name || (isAdmin ? 'Администрация' : 'Гость');
        const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const img = msg.image_url ? `<img src="${msg.image_url}" alt="">` : '';
        return `
          <div class="msg-bubble-row" style="align-items:${align};">
            <div class="msg-bubble-time">${escapeHtml(name)} · ${time}</div>
            <div class="msg-bubble" style="background:${bg}; color:${color}; border-color:${border};">${msg.message ? escapeHtml(msg.message) : ''}${img}</div>
          </div>`;
      }).join('');
      if (!isPolling || wasAtBottom) container.scrollTop = container.scrollHeight;
    }

    function connectStream(ticketId) {
      closeStream();
      try {
        eventSource = new EventSource(`/api/support/stream?ticketId=${encodeURIComponent(ticketId)}`);
        eventSource.onmessage = (e) => {
          let data;
          try { data = JSON.parse(e.data); } catch (err) { return; }
          if (!data) return;
          if (data.type === 'status') {
            activeTicketStatus = data.status;
            renderStatusToggle();
            return;
          }
          if (data.id && !messagesCache.some(m => m.id === data.id)) {
            messagesCache.push(data);
            renderMessages(true);
            fetch('/api/support/read', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ticketId })
            });
            loadContacts();
          }
        };
        eventSource.onerror = () => {
          if (eventSource) { eventSource.close(); eventSource = null; }
          if (pollingInterval) clearInterval(pollingInterval);
          pollingInterval = setInterval(() => loadMessages(true), 4000);
        };
      } catch (e) {
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(() => loadMessages(true), 4000);
      }
    }
    function closeStream() {
      if (eventSource) { eventSource.close(); eventSource = null; }
      if (pollingInterval) { clearInterval(pollingInterval); pollingInterval = null; }
    }

    document.getElementById('msgForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeTicketId) return;
      const input = document.getElementById('msgInput');
      const message = input.value.trim();
      if (!message) return;
      input.disabled = true;
      try {
        const res = await fetch('/api/support/reply', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ticketId: activeTicketId, message })
        });
        if (res.ok) {
          input.value = '';
          await loadMessages();
        } else {
          showToast('Ошибка при отправке', 'error');
        }
      } catch (e) {
        showToast('Ошибка сети', 'error');
      } finally {
        input.disabled = false;
        input.focus();
      }
    });

    init();
  </script>
</body>
</html>
