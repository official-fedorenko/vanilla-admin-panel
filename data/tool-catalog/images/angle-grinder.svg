<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" fill="none" stroke="#8a94a6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
  <title>Углошлифовальная машина (болгарка)</title>
  <!-- корпус (двигатель) -->
  <rect x="40" y="48" width="80" height="34" rx="16" fill="#8a94a6" fill-opacity="0.10"/>
  <!-- редуктор -->
  <rect x="116" y="44" width="26" height="42" rx="6" fill="#8a94a6" fill-opacity="0.14"/>
  <!-- защитный кожух -->
  <path d="M142 40 A34 34 0 0 1 142 90" fill="#8a94a6" fill-opacity="0.10"/>
  <!-- диск -->
  <circle cx="150" cy="65" r="26"/>
  <circle cx="150" cy="65" r="4" fill="#8a94a6"/>
  <!-- боковая рукоятка -->
  <path d="M96 48 L104 30" />
  <rect x="98" y="20" width="16" height="14" rx="6" fill="#8a94a6" fill-opacity="0.14"/>
  <!-- кабель -->
  <path d="M40 66 Q22 70 26 96" stroke-dasharray="2 7"/>
</svg>
